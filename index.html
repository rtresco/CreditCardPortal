<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b3d78">
<title>Card Rewards & Benefits</title>
<link rel="stylesheet" href="styles.css">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="72x72" href="assets/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="114x114" href="assets/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="144x144" href="assets/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/android-icon-512x512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b3d78">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Card Portal">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-icon"><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h.01"/></svg></span></div>
    <div>
      <div class="brand-title">Credit Card Portal</div>
      <div class="brand-subtitle">Rewards & Offers • Benefits • Payment Details • Card Information</div>
    </div>
  </div>
  <div class="updated">Updated Nov 15, 2026</div>
</header>

<nav class="desktop-nav">
  <button class="nav-btn active" data-view="rewards"><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8m-4-4v4M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4v2a4 4 0 0 0 4 4m9-6h3v2a4 4 0 0 1-4 4"/></svg></span> Card Rewards</button>
  <button class="nav-btn" data-view="offers"><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5M5 9a7 7 0 0 1 12-3l3 6M4 12l3 6a7 7 0 0 0 12-3"/></svg></span> Card Categories & Offers</button>
  <button class="nav-btn" data-view="benefits"><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h.01"/></svg></span> Card Benefits</button>
  <button class="nav-btn" data-view="bills"><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V3h6v1m-6 6h6m-6 4h6m-6 4h4"/></svg></span> Recurring Payments</button>
  <button class="nav-btn" data-view="cards"><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span> My Cards</button>
</nav>

<main>
<section id="rewards" class="view active">
  <div class="hero rewards-search-only">
    <h2 class="rewards-panel-title"><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg></span> Highest Active Rewards</h2>
    <div class="search-wrap">
      <span><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span></span>
      <input id="globalSearch" type="search" placeholder="Filter by location or service..." autocomplete="off">
    </div>
  </div>

  <div id="searchResults" class="search-results hidden"></div>
  <div id="rewardGrid" class="reward-grid"></div>

</section>

<section id="bills" class="view">
  <div class="page-heading">
    <h1><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V3h6v1m-6 6h6m-6 4h6m-6 4h4"/></svg></span> Recurring Payments</h1>
  </div>
  <div class="filter-row" id="billFilters"></div>
  <div id="billsTable" class="table-card"></div>
</section>

<section id="benefits" class="view">
  <div class="page-heading">
    <h1><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h.01"/></svg></span> Card Benefits</h1>
  </div>
  <div class="card-tabs" id="benefitTabs"></div>
  <div id="benefitContent"></div>
</section>

<section id="offers" class="view">
  <div class="page-heading">
    <h1><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5M5 9a7 7 0 0 1 12-3l3 6M4 12l3 6a7 7 0 0 0 12-3"/></svg></span> Quarterly Categories & Offers</h1>
  </div>
  <div id="offersGrid" class="offers-grid"></div>
</section>

<section id="cards" class="view">
  <div class="page-heading">
    <h1><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span> My Cards</h1>
  </div>
  <div id="cardsGrid" class="cards-grid"></div>
</section>
</main>

<nav class="mobile-nav">
  <button class="nav-btn active" data-view="rewards"><span><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8m-4-4v4M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4v2a4 4 0 0 0 4 4m9-6h3v2a4 4 0 0 1-4 4"/></svg></span></span><small>Rewards</small></button>
  <button class="nav-btn" data-view="offers"><span><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5M5 9a7 7 0 0 1 12-3l3 6M4 12l3 6a7 7 0 0 0 12-3"/></svg></span></span><small>Offers</small></button>
  <button class="nav-btn" data-view="benefits"><span><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h.01"/></svg></span></span><small>Benefits</small></button>
  <button class="nav-btn" data-view="bills"><span><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V3h6v1m-6 6h6m-6 4h6m-6 4h4"/></svg></span></span><small>Payments</small></button>
  <button class="nav-btn" data-view="cards"><span><span class="portal-lucide" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span></span><small>Cards</small></button>
</nav>

<script src="script.js"></script>
</body>
</html>
